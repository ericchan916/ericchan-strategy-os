<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EricChan·战略OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Ask Mode · 个人战略总控入口</p>
        <h1>EricChan·战略OS</h1>
        <p class="subtitle">主动提问，而不是被动推送。</p>
        <p class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          本地运行 · 中文问答 · 不自动派发智能体
        </p>
      </header>

      <section class="panel questions-panel" aria-labelledby="questions-title">
        <div class="panel-head">
          <h2 id="questions-title">推荐问题</h2>
          <p class="panel-hint">点一下，直接进入战略判断。</p>
        </div>
        <div id="recommendedQuestions" class="question-grid" data-questions='__RECOMMENDED_QUESTIONS__'></div>
      </section>

      <section class="panel ask-panel" aria-labelledby="ask-title">
        <div class="panel-head">
          <h2 id="ask-title">提问窗口</h2>
          <p class="panel-hint">Ctrl + Enter 提交。</p>
        </div>
        <textarea
          id="questionInput"
          rows="4"
          spellcheck="false"
          aria-label="提问输入框"
          placeholder="输入你的问题，例如：我看到一个 ESP32 墨水屏日历项目，帮我体检一下。"
        ></textarea>
        <div class="actions">
          <button id="askButton" type="button" class="primary-button">提问</button>
          <span id="statusText" class="status-text" role="status" aria-live="polite">等待提问。</span>
        </div>
      </section>

      <section class="panel output-panel" aria-labelledby="answer-title">
        <div class="panel-head">
          <h2 id="answer-title">战略回答</h2>
          <p class="panel-hint">基于当前 context / 报告 / 机会池 / Daily Command。</p>
        </div>
        <div id="questionEcho" class="question-echo" hidden></div>
        <article id="answerOutput" class="answer empty" aria-live="polite">
          点击上方一个推荐问题，或在输入框里写下你的问题。
        </article>
      </section>

      <footer class="footer">
        <p>
          项目开工包会先交给 <strong>GPT 5.5 Thinking</strong> 总控判断，不会默认直接派发
          Codex / WorkBuddy / OpenDesign / MiniMax。
        </p>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
